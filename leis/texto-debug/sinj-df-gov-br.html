</title><script type="text/javascript">

        var onLoadCaptchaCallback = function () {
            $('#div_captcha').remove();
            $('#form_fale_conosco input[name=tpv]').val('g');
        }

        function fAdaptive() {
            if ($('div.right-top').offset().left < $('div.logo').width()) {
                $('div.right-top').addClass('mobile');
            }
            else {
                $('div.right-top').removeClass('mobile');
            }
            if ($(document).scrollTop() > 72 && window.innerWidth >= 800) {
                $('#div_top').addClass('fix');
            }
            else {
                $('#div_top').removeClass('fix');
            }
        }

        $(document).ready(function () {
            if (history.length <= 0) {
                $('#div_voltar').hide();
            }
            $('#span_versao').text(_versao);

            var onShowTop = $('#slave').hasClass('on-show-top');
            $('.ancora a').click(function () {
                var alvo = $(this).attr('href').split('#').pop();
                if (IsNotNullOrEmpty(alvo)) {
                    $('html, body').animate({ scrollTop: ($('#' + alvo).offset().top - 113) }, 1000);
                }
                else {
                    $('html, body').animate({ scrollTop: 0 }, 500);
                }
                return false;
            });

            $('#lbOK').click(function () {
                if (Pesquisar('form_pesquisa_master')) {
                    $("#form_pesquisa_master").submit();
                }
            });

            var h_body = Math.max(document.body.scrollHeight, document.body.offsetHeight, document.documentElement.clientHeight, document.documentElement.scrollHeight, document.documentElement.offsetHeight);
            var h_page = window.innerHeight;
            var w_body = Math.max(document.body.scrollWidth, document.body.offsetWidth, document.documentElement.clientWidth, document.documentElement.scrollWidth, document.documentElement.offsetWidth);

            $(document).scroll(function () {
                if (h_body > h_page && onShowTop) {
                    $('#show_top').show();
                }
                else {
                    $('#show_top').hide();
                }
                fAdaptive();
            });
            fAdaptive();
            $(window).resize(function () {
                fAdaptive();
            });

            // Se o clique for na parte do conteúdo da página, o menu não deve estar aberto. (mobile)
            $('div.content').click(function () {
                $('#div_top .menu').removeClass('open');
            });

            $('[data-toggle="tooltip"]').tooltip({ container: "#div_tooltip", trigger: "hover" });

            $('#nr_cpf_fale_conosco').attr('onKeypress', 'mascara(this,mcpf)');
            $('#nr_telefone_fale_conosco').attr('onKeypress', 'mascara(this,mtel)');

        });

        function clickTopoFaleConosco(_ch) {

            if ($('#div_fale_conosco').hasClass('closed')) {
                if (!IsNotNullOrEmpty(_ch)) {
                    html2canvas(document.body, {
                        onrendered: function (canvas) {
                            $('#form_fale_conosco input[name=print]').val(canvas.toDataURL('image/png'));
                        }
                    });
                }
                $('#div_fale_conosco').removeClass('closed');
                $('#div_fale_conosco').addClass('opened');

            }
            else {
                closeFaleConosco();
            }
        }

        function closeFaleConosco() {
            $('#div_fale_conosco').addClass('closed');
            $('#div_fale_conosco').removeClass('opened');
        }
    </script>
