name: Dividir dados por ano

# Quando você sobe um arquivo de dados grande (Constitucionalidade ou
# Reclamações), este robô roda scripts/dividir_por_ano.py, que gera a pasta
# "anos/" ao lado dele (index.json + um arquivo por ano). As páginas carregam
# só os anos que precisam mostrar.
on:
  push:
    branches: [main]
    paths:
      - controleconst/adi_dados.js
      - reclamacoes/reclamacoes-data.js
      - scripts/dividir_por_ano.py
      - scripts/limpar_decisoes.py
      - scripts/classificar_controle.js
      - scripts/classificar_reclamacoes.js
      - scripts/score-curadoria.js
  workflow_dispatch: # botão "Run workflow" para dividir na mão

permissions:
  contents: write

concurrency:
  group: dividir-dados
  cancel-in-progress: false

jobs:
  dividir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tira decisões repetidas e sem conteúdo (só andamento: pauta, vista,
      # amicus curiae, rito do art. 12…) — scripts/limpar_decisoes.py
      - name: Limpar decisões
        run: python3 scripts/limpar_decisoes.py controle reclamacoes

      # curadoria do Controle: tira o que é só certidão de resultado e marca
      # prioritárias (P) e outras (O) — scripts/classificar_controle.js
      - name: Classificar o Controle
        run: node scripts/classificar_controle.js && node scripts/classificar_reclamacoes.js

      - name: Dividir por ano
        run: python3 scripts/dividir_por_ano.py

      - name: Salvar os arquivos gerados
        id: salvar
        run: |
          git add -A controleconst/anos reclamacoes/anos controleconst/adi_dados.js reclamacoes/reclamacoes-data.js
          if git diff --cached --quiet; then
            echo "Nada mudou."; echo "mudou=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --cached --name-only > alterados.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "Divide dados por ano (automático)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "mudou=1" >> "$GITHUB_OUTPUT"
