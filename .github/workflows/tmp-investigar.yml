name: tmp investigar fontes
on:
  push:
    branches: [ccr-ff185eee-he0tot]
    paths: ['.github/workflows/tmp-investigar.yml']
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          g() { echo; echo "######## $1"; curl -sSL --max-time 40 -A "$UA" -H 'Accept-Language: pt-BR' -o p.html -w 'HTTP %{http_code} %{content_type} %{size_download}b\n' "$1" || echo FALHOU; }
          g "https://atos.cnj.jus.br/jurisprudencia"
          python3 - <<'P'
          import re
          s=open('p.html',encoding='utf-8',errors='replace').read()
          for m in list(re.finditer(r'/files/original\w+\.pdf', s))[:3]:
              print('-----'); print(re.sub(r'\s+',' ',s[max(0,m.start()-1500):m.end()+300]))
          P
          g "https://www.cnmp.mp.br/portal/institucional/comissoes/comissao-de-acompanhamento-legislativo-e-jurisprudencia/jurisprudenciacalj/boletim-da-sessao"
          python3 - <<'P'
          import re
          s=open('p.html',encoding='utf-8',errors='replace').read()
          ms=list(re.finditer(r'Boletim_de_Sessao/[^"\']+', s))
          print(len(ms),'links Boletim_de_Sessao')
          for m in ms[:4]:
              print('-----'); print(re.sub(r'\s+',' ',s[max(0,m.start()-700):m.end()+300]))
          i=s.find('2026'); print('== primeiro 2026:', re.sub(r'\s+',' ',s[max(0,i-300):i+1500]))
          P
          g "https://atos.cnj.jus.br/files/original214336202609146aa86a88879c5.pdf"
          python3 - <<'P'
          import re,zlib
          b=open('p.html','rb').read(); print(b[:8])
          print(re.findall(rb'/CreationDate\s*\(D:\d{8}',b)[:3], re.findall(rb'CreateDate>[^<]{0,25}',b)[:3])
          n=0
          for m in re.finditer(rb'stream\r?\n(.*?)endstream',b,re.S):
              try: d=zlib.decompress(m.group(1))
              except Exception: continue
              for x in re.findall(rb'(?:Informativo|INFORMATIVO)[^\n]{0,80}',d)[:2]: print('TXT',x); n+=1
              if n>6: break
          P
