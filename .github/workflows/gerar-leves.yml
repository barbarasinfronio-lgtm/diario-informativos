name: Gerar dados leves

# Antes, tira as decisões repetidas e sem conteúdo (scripts/limpar_decisoes.py).
# As páginas abrem com versões leves dos dados (pasta leve/) e só baixam o
# texto completo quando precisam. Este robô roda scripts/gerar_leves.js e
# atualiza a pasta leve/ sempre que os dados do Diário das Decisões mudam:
#   - a cada envio de um desses arquivos (do Mac, do GitHub ou de uma sessão);
#   - de 3 em 3 horas, por garantia (envios feitos por outros robôs do GitHub
#     não disparam este);
#   - no botão "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - site/decisoes/rg-repetitivos-data.js
      - stj/teses.json
      - stf/extras.json
      - tst/decisoes.json
      - stj/acordaos/indice.json
      - stj/acordaos/indice-*.json
      - stf/acordaos/indice.json
      - tst/acordaos/indice.json
      - informativos/indice.json
      - controleconst/adi_dados.js
      - provas/cobrancas.json
      - scripts/ligar_repetitivos.py
      - stj/repetitivos-scon.json
      - site/leis/normas-citadas.js
      - scripts/gerar_leves.js
      - scripts/gerar_relacionados.js
      - scripts/gerar_cronograma.js
      - scripts/gerar_destaques_informativos.js
      - scripts/gerar_julgados_por_artigo.js
      - site/leis/leis-data.js
      - site/leis/normas-data.js
      - site/sumulas/sumulas-data.js
      - leis/texto/citadas.json
      - scripts/limpar_decisoes.py
  # ADI/ADPF/ADC/ADO novas: o robô "Dividir dados por ano" separa o arquivo em controleconst/anos/ (e o envio dele não
  # dispara o "push" acima); quando ele termina, este roda em seguida e já inclui as decisões novas em "Com julgados".
  workflow_run:
    workflows: ["Dividir dados por ano"]
    types: [completed]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-leves
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tira decisões repetidas e sem conteúdo (scripts/limpar_decisoes.py)
      - name: Limpar decisões
        run: python3 scripts/limpar_decisoes.py decisoes

      # liga cada Tema repetitivo do STJ à ementa do acórdão e ao Informativo (stj/repetitivos/)
      - name: Ligar repetitivos
        run: python3 scripts/ligar_repetitivos.py

      - name: Gerar leve/
        run: node scripts/gerar_leves.js

      # "Leia também": decisões, súmulas e resoluções ligadas a cada lei (leve/relacionados.json)
      - name: Gerar relacionados
        run: node scripts/gerar_relacionados.js

      # decisões dos informativos que valem a revisão (leve/destaques-informativos.json)
      - name: Gerar destaques de informativos
        run: node scripts/gerar_destaques_informativos.js

      # "Com julgados" no Diário de Leis: até 2 decisões por artigo (leis/julgados/)
      - name: Gerar julgados por artigo
        run: node scripts/gerar_julgados_por_artigo.js

      # dados da página "Meu Cronograma" (leve/cronograma.json) — depende do arquivo acima
      - name: Gerar dados do cronograma
        run: node scripts/gerar_cronograma.js

      - name: Salvar os arquivos gerados
        id: salvar
        run: |
          git add -A leve leis/julgados stj/repetitivos site/decisoes/rg-repetitivos-data.js stj/teses.json stf/extras.json tst/decisoes.json stj/acordaos stf/acordaos/indice.json tst/acordaos/indice.json informativos/indice.json
          if git diff --cached --quiet; then
            echo "Nada mudou."; echo "mudou=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --cached --name-only > alterados.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "Limpa decisões e atualiza dados leves (automático)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "mudou=1" >> "$GITHUB_OUTPUT"
