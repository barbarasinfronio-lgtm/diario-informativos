name: Atualizacao Semanal de Informativos

on:
  schedule:
    # Executa todas as segundas-feiras às 09:00 UTC (06:00 de Brasília)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Permite que você clique num botão para testar manualmente quando quiser

permissions:
  contents: write # precisa para o commit/push automático no fim

jobs:
  verificar-e-atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar e catalogar novas edições
        run: node scripts/atualizar_informativos.mjs

      - name: Gravar alterações no repositório (Commit & Push)
        run: |
          git config --global user.name "Robô Estuda Mana"
          git config --global user.email "bot@estudamana.com.br"
          git add diario-data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: novos informativos do STF adicionados [skip ci]" && git push)
