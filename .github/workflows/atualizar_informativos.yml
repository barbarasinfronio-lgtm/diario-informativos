name: Atualizar Informativos do STF

# Só roda quando alguém aperta "Run workflow" (aba Actions → "Atualizar
# Informativos do STF"), uma vez por semana — não há agendamento.
# Confere se saíram Informativos novos do STF, acrescenta em diario-data.js,
# envia para o main e limpa o cache do jsDelivr para o site mostrar na hora.
on:
  workflow_dispatch:

permissions:
  contents: write # commit/push no fim

concurrency:
  group: atualizar-informativos
  cancel-in-progress: false

jobs:
  verificar-e-enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # O servidor do STF manda o certificado HTTPS sem o intermediário da
      # cadeia. Navegadores completam sozinhos; o Node não, e dava
      # UNABLE_TO_VERIFY_LEAF_SIGNATURE (era isso que fazia o robô antigo
      # achar que a edição "ainda não saiu"). Aqui baixamos o intermediário
      # do endereço indicado no próprio certificado (AIA), conferimos que ele
      # é assinado por uma autoridade confiável do sistema, e só então o
      # entregamos ao Node.
      - name: Completar a cadeia de certificados do STF
        run: |
          set -e
          echo | openssl s_client -connect www.stf.jus.br:443 -servername www.stf.jus.br -showcerts 2>/dev/null \
            | awk '/BEGIN CERT/{c++} c==1{print} /END CERT/&&c==1{exit}' > folha.pem
          aia=$(openssl x509 -in folha.pem -noout -ext authorityInfoAccess | sed -n 's/.*CA Issuers - URI:\(.*\)/\1/p' | head -1)
          echo "Intermediário: $aia"
          curl -sSfL "$aia" -o inter.bin
          openssl x509 -inform DER -in inter.bin -out inter.pem 2>/dev/null || cp inter.bin inter.pem
          openssl verify -CApath /etc/ssl/certs inter.pem
          openssl verify -CApath /etc/ssl/certs -untrusted inter.pem folha.pem
          echo "NODE_EXTRA_CA_CERTS=$PWD/inter.pem" >> "$GITHUB_ENV"

      - name: DIAGNOSTICO TEMPORARIO
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          for u in https://www.stf.jus.br/arquivo/cms/informativoSTF/anexo/Informativo_PDF/Informativo_stf_1229.pdf \
                   https://www.stf.jus.br/arquivo/informativo/documento/informativo.htm \
                   https://www.stf.jus.br/ \
                   "https://portal.stf.jus.br/textos/verTexto.asp?servico=informativoSTF"; do
            echo "== $u"
            curl -s -o r.bin -w 'curl-simples %{http_code} %{content_type}\n' --max-time 30 "$u" || true
            curl -s -o r.bin -w 'curl-navegador %{http_code} %{content_type}\n' --max-time 30 --compressed -H "User-Agent: $UA" -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' -H 'Accept-Language: pt-BR,pt;q=0.9' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' -H 'Upgrade-Insecure-Requests: 1' "$u" || true
            head -c 400 r.bin | tr -c '[:print:]\n' '.'; echo
            curl -sI --max-time 30 -H "User-Agent: $UA" "$u" | grep -iE '^(server|x-|cf-|set-cookie|via)' || true
          done

      - name: Verificar novas edições do STF
        run: node scripts/atualizar_informativos.mjs

      - name: Enviar para o main
        id: enviar
        run: |
          if git diff --quiet -- diario-data.js; then
            echo "Nada novo para enviar."
            echo "enviado=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Robô Estuda Mana"
          git config user.email "bot@estudamana.com.br"
          git add diario-data.js
          git commit -m "Informativos: novas edições do STF (robô)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "enviado=sim" >> "$GITHUB_OUTPUT"

      # O push feito pelo robô não dispara o limpar-cache-jsdelivr.yml
      # (o GitHub não encadeia workflows a partir do token do robô), então
      # a limpeza é feita aqui mesmo: agora, e de novo depois de 1 minuto.
      - name: Limpar cache do jsDelivr
        if: steps.enviar.outputs.enviado == 'sim'
        run: |
          url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/diario-data.js"
          for espera in 30 60; do
            sleep "$espera"
            curl -sS "$url" || true
            echo
          done
