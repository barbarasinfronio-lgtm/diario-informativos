name: Verificar site (temporário)
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/verificar-site.mjs
        env:
          URL: https://www4.planalto.gov.br/legislacao/portal-legis/resenha-diaria
