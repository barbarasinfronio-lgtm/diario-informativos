name: Verificar site (temporário)
on:
  push:
    branches: [claude/wonderful-heisenberg-qcfpuf]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/verificar-site.mjs
        env: { PAGES: 'diario-dos-informativos,diario-de-leis' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: prints, path: prints/ }
