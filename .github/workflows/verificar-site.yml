name: Verificar site (temporário)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/verificar-site.mjs
        env: { PAGES: 'diario-de-leis,diario-dos-informativos,editais,meus-premios' }
