name: Limpar cache do jsDelivr

# O site carrega os arquivos por cdn.jsdelivr.net/gh/...@main/, e o jsDelivr
# guarda uma cópia por até 12h (ou mais). Sem isso, uma correção enviada ao
# main demora horas para aparecer. Este robô pede ao jsDelivr para buscar de
# novo todos os .js e .css da raiz, e os alterados em subpastas, sempre
# que o main muda.
on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" para limpar na mão quando quiser

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Todos os .js/.css da raiz + os .js/.css alterados neste envio em
      # qualquer pasta (ex.: controleconst/, reclamacoes/), que antes ficavam
      # de fora e podiam demorar horas para aparecer.
      - name: Listar arquivos
        run: |
          ls *.js *.css > arquivos.txt
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git ls-files '*.js' '*.css' >> arquivos.txt   # na mão: todas as pastas
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- '*.js' '*.css' >> arquivos.txt
          fi
          sort -u arquivos.txt -o arquivos.txt

      # Limpar logo depois do envio não basta: nos primeiros segundos o
      # jsDelivr ainda enxerga a versão anterior do main e volta a guardá-la
      # por horas. Por isso espera 1 minuto, limpa, e limpa de novo 2 minutos
      # depois, por garantia.
      - name: Limpar cache de cada arquivo
        run: |
          base="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main"
          falhas=0
          for rodada in 1 2; do
            if [ "$rodada" = 1 ]; then sleep 60; else sleep 120; fi
            echo "== rodada $rodada"
            while read -r f; do
              [ -z "$f" ] && continue
              status=$(curl -sS -o resposta.json -w '%{http_code}' "$base/$f" || echo 000)
              echo "$f -> HTTP $status"
              if [ "$status" != "200" ] && [ "$rodada" = 2 ]; then
                cat resposta.json 2>/dev/null; echo
                falhas=$((falhas + 1))
              fi
            done < arquivos.txt
          done
          if [ "$falhas" -gt 0 ]; then
            echo "::warning::$falhas arquivo(s) não foram limpos do cache"
          fi
